<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" role="img" aria-label="Mascota capibara color caramelo con auriculares morados">
  <defs>
    <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1c38b"/>
      <stop offset=".52" stop-color="#dca36b"/>
      <stop offset="1" stop-color="#b97849"/>
    </linearGradient>
    <linearGradient id="cream" x1="0" y1="0" x2="0" y2="1">

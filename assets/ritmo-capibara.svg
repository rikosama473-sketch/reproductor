      <stop offset="1" stop-color="#f0d1a0"/>
    </linearGradient>
    <linearGradient id="plum" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#bca4f3"/>
      <stop offset=".5" stop-color="#7956bd"/>
      <stop offset="1" stop-color="#4d367f"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe5a2"/>
      <stop offset="1" stop-color="#e7a95d"/>

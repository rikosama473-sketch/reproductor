name: Deploy Ritmo to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Upload static app
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
          # A retry reuses the workflow run ID, but creates another artifact.
          # Give each attempt a distinct name so deploy-pages never sees duplicates.
          name: github-pages-${{ github.run_attempt }}
      - name: Publish site
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

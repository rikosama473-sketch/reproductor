name: Validate Ritmo
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install pinned Capacitor runtime dependencies
        run: npm install --no-audit --no-fund
      - name: Check JavaScript syntax
        run: |
          node --check src/app.js
          node --check src/youtube-history.js
          node --check src/audio-output-volume.js
          node --check src/media-session-state.js
          node --check src/youtube-player-errors.js
          node --check scripts/media-session-state-check.mjs
          node --check scripts/youtube-player-errors-check.mjs
          node --check scripts/prepare-mobile.mjs
          node --check scripts/mobile-package-check.mjs
          node --check scripts/mobile-touch-check.mjs
          node --check scripts/configure-android.mjs
          node --check scripts/prepare-android-native.mjs
          node --check scripts/android-music-library-check.mjs
          node --check src/storage.js
          node --check sw.js
          node --check scripts/smoke-check.mjs
          node --check scripts/indexeddb-recovery-check.mjs
          node --check scripts/youtube-history-check.mjs
          node --check scripts/audio-output-volume-check.mjs
          node --check scripts/service-worker-fetch-check.mjs
          node --check scripts/history-limit-check.mjs
      - name: Check app shell wiring
        run: |
          node scripts/smoke-check.mjs
          node scripts/indexeddb-recovery-check.mjs
          node scripts/youtube-history-check.mjs
          node scripts/audio-output-volume-check.mjs
          node scripts/media-session-state-check.mjs
          node scripts/youtube-player-errors-check.mjs
          node scripts/prepare-mobile.mjs
          node scripts/mobile-package-check.mjs
          node scripts/mobile-touch-check.mjs
          node scripts/android-music-library-check.mjs
          node scripts/service-worker-fetch-check.mjs
          node scripts/history-limit-check.mjs

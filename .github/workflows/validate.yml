name: Validate Ritmo
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install pinned Capacitor runtime dependencies
        run: npm install --no-audit --no-fund
      - name: Run the shared validation and regression suite
        run: npm run validate

name: Validate Ritmo
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check src/app.js
          node --check src/storage.js
          node --check sw.js
          node --check scripts/smoke-check.mjs
      - name: Check app shell wiring
        run: node scripts/smoke-check.mjs

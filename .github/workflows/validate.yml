name: Validate Ritmo
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check src/app.js
          node --check src/youtube-history.js
          node --check src/storage.js
          node --check sw.js
          node --check scripts/smoke-check.mjs
          node --check scripts/indexeddb-recovery-check.mjs
          node --check scripts/youtube-history-check.mjs
      - name: Check app shell wiring
        run: |
          node scripts/smoke-check.mjs
          node scripts/indexeddb-recovery-check.mjs
          node scripts/youtube-history-check.mjs
